name: Build Oneplus 8 Series (OxygenOS 13 A13) (XTD Kernel)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "oneplus_8_cn"
  DEVICE_CODENAME : "instantnoodle"

  CUSTOM_CMDS : "BRAND_SHOW_FLAG=oneplus CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/ppajda/android_kernel_oneplus_sm8250.git"
  KERNEL_BRANCH : "oos13.1"

  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_64_BRANCH : "aarch64"
  GCC_32_SOURCE : "https://github.com/JackA1ltman/Google-GCC-Android-4.9.git"
  GCC_32_BRANCH : "arm32"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "xtd_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/JackA1ltman/OP8_AnyKernel3.git"
  AK3_BRANCH : "main"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oxygen13.1_a13"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "op_kernel"

  SUSFS_FOLDER_FIXED: "kona_oos"
  SUSFS_PATCH_FIXED: "susfs_fixed"

  REKERNEL_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "true"
  KPM_INLINE: "true"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "true"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Oneplus 8 Series (OxygenOS 13 A13) (XTD Kernel)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      # ============================================
      # 📦 Droidspaces 支持开始
      # ============================================
      - name: 🐧 Add Droidspaces Kernel Configuration
        run: |
          # 进入内核源码目录（必须！）
          cd $GITHUB_WORKSPACE/device_kernel

          echo "### 开始添加 Droidspaces 内核配置 ###"
          DEFCONFIG_PATH="./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          if [ ! -f "$DEFCONFIG_PATH" ]; then
            echo "❌ 错误：找不到 defconfig 文件：$DEFCONFIG_PATH"
            exit 1
          fi
          
          declare -A DROIDSPACES_CONFIGS=(
            ["CONFIG_SYSCTL"]="y"
            ["CONFIG_SYSVIPC"]="y"
            ["CONFIG_POSIX_MQUEUE"]="y"
            ["CONFIG_NAMESPACES"]="y"
            ["CONFIG_PID_NS"]="y"
            ["CONFIG_UTS_NS"]="y"
            ["CONFIG_IPC_NS"]="y"
            ["CONFIG_SECCOMP"]="y"
            ["CONFIG_SECCOMP_FILTER"]="y"
            ["CONFIG_CGROUPS"]="y"
            ["CONFIG_CGROUP_DEVICE"]="y"
            ["CONFIG_CGROUP_PIDS"]="y"
            ["CONFIG_MEMCG"]="y"
            ["CONFIG_CGROUP_SCHED"]="y"
            ["CONFIG_FAIR_GROUP_SCHED"]="y"
            ["CONFIG_CGROUP_FREEZER"]="y"
            ["CONFIG_CGROUP_NET_PRIO"]="y"
            ["CONFIG_DEVTMPFS"]="y"
            ["CONFIG_OVERLAY_FS"]="y"
            ["CONFIG_TMPFS_XATTR"]="y"
            ["CONFIG_FW_LOADER"]="y"
            ["CONFIG_FW_LOADER_USER_HELPER"]="y"
            ["CONFIG_FW_LOADER_COMPRESS"]="y"
            ["CONFIG_NET_NS"]="y"
            ["CONFIG_VETH"]="y"
            ["CONFIG_BRIDGE"]="y"
            ["CONFIG_NETFILTER"]="y"
            ["CONFIG_BRIDGE_NETFILTER"]="y"
            ["CONFIG_NETFILTER_ADVANCED"]="y"
            ["CONFIG_NF_CONNTRACK"]="y"
            ["CONFIG_IP_NF_IPTABLES"]="y"
            ["CONFIG_IP_NF_FILTER"]="y"
            ["CONFIG_NF_NAT"]="y"
            ["CONFIG_NF_TABLES"]="y"
            ["CONFIG_IP_NF_TARGET_MASQUERADE"]="y"
            ["CONFIG_NETFILTER_XT_TARGET_MASQUERADE"]="y"
            ["CONFIG_NETFILTER_XT_TARGET_TCPMSS"]="y"
            ["CONFIG_NETFILTER_XT_MATCH_ADDRTYPE"]="y"
            ["CONFIG_NF_CONNTRACK_NETLINK"]="y"
            ["CONFIG_NF_NAT_REDIRECT"]="y"
            ["CONFIG_IP_ADVANCED_ROUTER"]="y"
            ["CONFIG_IP_MULTIPLE_TABLES"]="y"
            ["CONFIG_NF_CONNTRACK_IPV4"]="y"
            ["CONFIG_NF_NAT_IPV4"]="y"
            ["CONFIG_IP_NF_NAT"]="y"
            ["CONFIG_ANDROID_PARANOID_NETWORK"]="n"
          )
          
          for CONFIG in "${!DROIDSPACES_CONFIGS[@]}"; do
            VALUE="${DROIDSPACES_CONFIGS[$CONFIG]}"
            if grep -q "^${CONFIG}=" "$DEFCONFIG_PATH"; then
              sed -i "s/^${CONFIG}=.*/${CONFIG}=${VALUE}/" "$DEFCONFIG_PATH"
              echo "  ✅ 已更新: ${CONFIG}=${VALUE}"
            elif grep -q "^# ${CONFIG} is not set" "$DEFCONFIG_PATH"; then
              sed -i "s/^# ${CONFIG} is not set/${CONFIG}=${VALUE}/" "$DEFCONFIG_PATH"
              echo "  ✅ 已启用: ${CONFIG}=${VALUE}"
            else
              echo "${CONFIG}=${VALUE}" >> "$DEFCONFIG_PATH"
              echo "  ✅ 已添加: ${CONFIG}=${VALUE}"
            fi
          done
          
          echo "### Droidspaces 内核配置添加完成 ###"

      - name: 🩹 Apply Droidspaces Patches
        run: |
          echo "### 开始应用 Droidspaces 补丁 ###"
          cd $GITHUB_WORKSPACE/device_kernel
          
          PATCH_DIR="$GITHUB_WORKSPACE/droidspaces_patches"
          mkdir -p $PATCH_DIR
          
          echo "  📥 下载补丁 1: 01.fix_kernel_panic_in_xt_qtaguid.patch"
          wget -q -O $PATCH_DIR/01.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
          
          echo "  📥 下载补丁 2: 02.fix_restore_cgroup_file_prefix_handling.patch"
          wget -q -O $PATCH_DIR/02.patch "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          
          echo "  🔧 应用补丁 1..."
          patch -p1 --dry-run -i $PATCH_DIR/01.patch && patch -p1 -i $PATCH_DIR/01.patch
          echo "  ✅ 补丁 1 应用成功"
          
          echo "  🔧 应用补丁 2..."
          patch -p1 --dry-run -i $PATCH_DIR/02.patch && patch -p1 -i $PATCH_DIR/02.patch
          echo "  ✅ 补丁 2 应用成功"
          
          cd $GITHUB_WORKSPACE
          echo "### Droidspaces 补丁应用完成 ###"
      # ============================================
      # 📦 Droidspaces 支持结束
      # ============================================

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "CONFIG_CPU_BIG_ENDIAN=n" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_COMPAT_VDSO=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_LTO_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_INIT_STACK_NONE=y" >> ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          sed -i 's/# CONFIG_SECCOMP is not set/CONFIG_SECCOMP=y/' ./arch/arm64/configs/${{ env.DEFCONFIG_NAME }}

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
